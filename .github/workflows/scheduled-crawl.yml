# 如需开启定时爬取，将下方 on: 块恢复为以下内容即可：
#
# on:
#   schedule:
#     - cron: "0 1 * * *"   # 每天 UTC 01:00（北京时间 09:00）爬一次
#   workflow_dispatch: {}
name: scheduled-crawl

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Crawl & export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py crawl --export export.json

      - name: Commit export.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add export.json
          git diff --cached --quiet || git commit -m "chore: update export.json"
          git push

      - name: Build static site
        run: |
          mkdir -p site
          cp export.json site/export.json
          # 前台已是 Vue 单页应用，这里现场构建一份静态产物；
          # GitHub Pages 部署在 /<repo>/ 子路径下，构建时必须指定 base
          cd frontend
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/
          cp -r dist/. ../site/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

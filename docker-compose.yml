services:
  lxhub:
    image: ghcr.io/deerwan/lxhub:latest
    container_name: lxhub
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      - LXH_HOST=0.0.0.0
      - LXH_PORT=8787
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LXH_ADMIN_USER=${LXH_ADMIN_USER:-admin}
      - LXH_ADMIN_PASS=${LXH_ADMIN_PASS:-}
    restart: unless-stopped

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · LX 音源</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
[x-cloak]{display:none !important}
.admin-page{max-width:1000px;margin:0 auto;padding:28px 20px 56px}
.admin-top{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.admin-top h1{font-size:19px;margin:0;flex:1;min-width:130px}
.admin-card{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 20px;margin-bottom:14px}
.admin-card h3{margin:0 0 12px;font-size:11px;color:var(--mute);
  letter-spacing:.6px;text-transform:uppercase}
.admin-login{max-width:420px;margin:10vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:26px}
.admin-login h1{font-size:18px;margin:0 0 6px}
.admin-err{color:var(--red);font-size:12.5px;min-height:18px;margin:10px 0 4px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:10px}
.stat-box{background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:var(--r-sm);padding:11px 13px;min-width:0;overflow:hidden}
.stat-box b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-box span{font-size:12px;color:var(--mute)}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
a{color:var(--accent)}
</style>
<script defer src="/static/vendor/alpine.min.js"></script>
<script>
/* 尽早应用主题，避免刷新时闪一下错色 */
(function(){
  try{
    var t = localStorage.getItem("lxh.theme") || "system";
    var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = t === "system" ? (sysDark ? "dark" : "light") : t;
  }catch(e){}
})();
</script>
</head>
<body x-data="adminApp()" x-init="init()">

<!-- 登录视图（/login，或未登录访问 /admin 时） -->
<div class="admin-login" x-show="!authed" x-cloak>
  <h1>LX 音源 · 后台登录</h1>
  <input type="text" class="login-input" x-model="user" @keydown.enter="login()"
         placeholder="账户名" autocomplete="username" style="margin-top:16px">
  <input type="password" class="login-input" x-model="pass" @keydown.enter="login()"
         placeholder="密码" autocomplete="current-password" style="margin-top:8px">
  <div class="admin-err" x-text="err"></div>
  <button class="primary" style="width:100%" :disabled="busy" @click="login()">登录</button>
  <p class="muted" style="margin-top:14px;font-size:12px"><a href="/">← 返回首页</a></p>
</div>

<!-- 后台视图（/admin） -->
<div class="admin-page" x-show="authed" x-cloak>
  <div class="admin-top">
    <h1>后台管理</h1>
    <select id="themeSel" title="主题">
      <option value="system">跟随系统</option>
      <option value="dark">暗色</option>
      <option value="light">亮色</option>
    </select>
    <button @click="logout()">退出登录</button>
    <a href="/" class="muted" style="font-size:13px">返回首页</a>
  </div>

  <!-- 任务进度：后台触发爬取/检测后实时显示 -->
  <div class="admin-card" x-show="prog.running" x-cloak>
    <h3>任务进度</h3>
    <div class="prog-head">
      <b x-text="prog.title"></b>
      <span class="muted" x-text="prog.msg"></span>
      <span class="muted" x-text="prog.elapsed"></span>
    </div>
    <div class="bar" style="margin:10px 0 8px">
      <div class="bar-fill" :class="{'indet': prog.indet}" :style="'width:' + prog.pct + '%'"></div>
    </div>
    <div class="muted" x-text="prog.stats"></div>
    <pre x-text="prog.logs" style="margin-top:8px;max-height:180px"></pre>
  </div>

  <div class="admin-card">
    <h3>概览</h3>
    <div class="stat-row">
      <div class="stat-box"><b x-text="stats.total">—</b><span>收录链接</span></div>
      <div class="stat-box"><b x-text="stats.alive">—</b><span>当前可访问</span></div>
      <div class="stat-box"><b x-text="stats.valid">—</b><span>疑似音源脚本</span></div>
      <div class="stat-box"><b x-text="stats.lastCrawl" :title="stats.lastCrawlFull">—</b><span>最近爬取</span></div>
    </div>
  </div>

  <div class="admin-card">
    <div class="admin-form" id="adminForm"></div>
  </div>

  <div class="admin-card">
    <h3>操作</h3>
    <div class="admin-actions">
      <button class="primary" @click="save()">保存配置</button>
      <button :disabled="taskBusy" @click="crawl()">立即爬取</button>
      <button :disabled="taskBusy" @click="check()">重新检测</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/static/js/common.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
